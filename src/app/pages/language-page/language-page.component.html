<section class="language-page">
  <div class="container">
    <div class="language-card">
      <p class="eyebrow">{{ flags[language] }} {{ labels[language] }}</p>
      <h1>{{ currentTranslation.title }}</h1>
      <p class="intro">{{ currentTranslation.intro }}</p>

      <div class="translation-grid">
        <article *ngFor="let section of currentTranslation.sections" class="translation-block">
          <h2>{{ section.heading }}</h2>
          <p *ngFor="let paragraph of section.body">{{ paragraph }}</p>
        </article>
      </div>
    </div>
  </div>
</section>

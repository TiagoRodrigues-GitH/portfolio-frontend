<section class="contact-page">
	<div class="contact-shell">
		<div class="contact-header">
			<div class="profile-card">
				<img [src]="profileImage" alt="Foto de perfil de Tiago Rodrigues" />
				<div>
					<p class="eyebrow">{{ t.eyebrow }}</p>
					<h1>{{ t.title }}</h1>
					<p class="intro">{{ t.intro }}</p>
				</div>
			</div>

			<div class="contact-note">
				<span class="note-label">{{ t.availabilityLabel }}</span>
				<p>{{ t.availabilityText }}</p>
			</div>
		</div>

		<div class="contact-links">
			<a
				*ngFor="let contact of contactLinks"
				class="contact-link-card"
				[href]="contact.href"
				target="_blank"
				rel="noopener noreferrer"
				[attr.aria-label]="contact.label + ' - ' + contact.value"
			>
				<span class="contact-icon">{{ contact.icon }}</span>
				<div class="contact-content">
					<span class="contact-label">{{ contact.label }}</span>
					<strong>{{ contact.value }}</strong>
					<p>{{ contact.description }}</p>
				</div>
				<span class="contact-arrow">↗</span>
			</a>
		</div>

		<div class="media-preview-card">
			<p class="media-label">{{ t.mediaLabel }}</p>
			<a class="media-link" href="https://www.linkedin.com/in/tiagorodriguesde/" target="_blank" rel="noopener noreferrer">
				<span class="media-badge">📷</span>
				<span>{{ t.mediaLinkLabel }}</span>
			</a>
		</div>
	</div>
</section>
